<!DOCTYPE html>
<html lang="ru" style="background-color: #000000;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CalcOS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Современный калькулятор с историей вычислений">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <title>CalculatOS Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        :root {
            --accent: #ff9f0a;
            --glass: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, #1c2c3e 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 20px) 15px env(safe-area-inset-bottom, 15px);
        }

        .header-tools {
            display: flex;
            padding: 5px 0;
        }

        .icon-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            padding: 10px;
            cursor: pointer;
        }

        .display-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            padding-bottom: 20px;
        }

        .prev-line {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.4);
            min-height: 1.5rem;
            margin-bottom: 5px;
        }

        .main-line {
            font-size: 4rem;
            color: var(--text);
            font-weight: 200;
            white-space: nowrap;
            overflow: hidden;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        .btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: var(--glass);
            color: #fff;
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.2);
        }

        .btn.operator { background: var(--accent); font-size: 2rem; }
        .btn.system { background: rgba(255,255,255,0.25); color: #fff; }
        .btn.double { 
            grid-column: span 2; 
            aspect-ratio: auto; 
            border-radius: 50px; 
            justify-content: flex-start; 
            padding-left: 35px;
            height: 100%;
        }

        @media (max-height: 600px) {
            .btn { font-size: 1.3rem; }
            .main-line { font-size: 3rem; }
        }

        .history-view {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
            padding: 50px 25px;
        }
        .history-view.visible { transform: translateY(-100%); }
        .history-item { border-bottom: 1px solid #333; padding: 15px 0; text-align: right; }
        .history-item .expr { color: #888; font-size: 0.9rem; }
        .history-item .res { color: #fff; font-size: 1.4rem; }

        /* Install banner */
        #install-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,159,10,0.95);
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 10000;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(255,159,10,0.4);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        svg { width: 26px; height: 26px; fill: currentColor; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-tools">
        <button class="icon-btn" onclick="toggleH(true)">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </button>
    </div>

    <div class="display-section" id="swipe-box">
        <div class="prev-line" id="disp-prev"></div>
        <div class="main-line" id="disp-main">0</div>
    </div>

    <div class="buttons-grid">
        <button class="btn system" onclick="ac()">AC</button>
        <button class="btn system" onclick="del()">
            <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zM11.59 17L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>
        </button>
        <button class="btn system" onclick="pct()">%</button>
        <button class="btn operator" onclick="op('÷')">÷</button>
        
        <button class="btn" onclick="num('7')">7</button>
        <button class="btn" onclick="num('8')">8</button>
        <button class="btn" onclick="num('9')">9</button>
        <button class="btn operator" onclick="op('×')">×</button>
        
        <button class="btn" onclick="num('4')">4</button>
        <button class="btn" onclick="num('5')">5</button>
        <button class="btn" onclick="num('6')">6</button>
        <button class="btn operator" onclick="op('-')">−</button>
        
        <button class="btn" onclick="num('1')">1</button>
        <button class="btn" onclick="num('2')">2</button>
        <button class="btn" onclick="num('3')">3</button>
        <button class="btn operator" onclick="op('+')">+</button>
        
        <button class="btn double" onclick="num('0')">0</button>
        <button class="btn" onclick="num('.')">,</button>
        <button class="btn operator" onclick="eq()">=</button>
    </div>
</div>

<div class="history-view" id="hist-overlay">
    <div style="display: flex; justify-content: space-between; color: #fff; margin-bottom: 20px;">
        <h2 style="margin: 0;">История</h2>
        <div onclick="toggleH(false)" style="color: var(--accent); cursor: pointer;">Закрыть</div>
    </div>
    <div id="hist-list" style="overflow-y: auto; height: 85%;"></div>
</div>

<!-- Install PWA banner -->
<div id="install-banner" onclick="installPWA()">
    📲 Установить как приложение
</div>

<script>
    let cur = '0', pre = '', oper = null, clr = false;
    const dm = document.getElementById('disp-main'), dp = document.getElementById('disp-prev'), hl = document.getElementById('hist-list');

    function upd() {
        let s = cur.replace('.', ',');
        dm.innerText = s;
        dm.style.fontSize = s.length > 9 ? '2.2rem' : s.length > 6 ? '3rem' : '4rem';
        dp.innerText = pre ? `${pre.replace('.', ',')} ${oper}` : '';
    }

    function num(n) {
        if (cur === '0' || clr) { cur = n === '.' ? '0.' : n; clr = false; }
        else if (cur.length < 12) { if (n === '.' && cur.includes('.')) return; cur += n; }
        upd(); vbr();
    }

    function ac() { cur = '0'; pre = ''; oper = null; upd(); }
    function del() { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; upd(); }
    function pct() { cur = (parseFloat(cur)/100).toString(); upd(); }
    function op(o) { if (oper && !clr) eq(); pre = cur; oper = o; clr = true; upd(); }

    function eq() {
        if (!oper) return;
        let a = parseFloat(pre), b = parseFloat(cur), r = 0;
        if (oper === '+') r = a + b;
        if (oper === '-') r = a - b;
        if (oper === '×') r = a * b;
        if (oper === '÷') r = b !== 0 ? a / b : 'Error';
        
        if (r !== 'Error') {
            r = Math.round(r * 1e8) / 1e8;
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<div class="expr">${pre} ${oper} ${cur} =</div><div class="res">${r}</div>`;
            hl.prepend(item);
        }
        cur = r.toString(); oper = null; pre = ''; clr = true; upd();
    }

    function toggleH(s) { document.getElementById('hist-overlay').classList.toggle('visible', s); }
    function vbr() { if (navigator.vibrate) navigator.vibrate(5); }

    let sx = 0;
    document.getElementById('swipe-box').ontouchstart = e => sx = e.touches[0].clientX;
    document.getElementById('swipe-box').ontouchend = e => { if (Math.abs(e.changedTouches[0].clientX - sx) > 60) del(); }

    // =====================
    // PWA Service Worker
    // =====================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW error:', err));
        });
    }

    // =====================
    // PWA Install Banner
    // =====================
    let deferredPrompt = null;
    const banner = document.getElementById('install-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 8000);
    });

    function installPWA() {
        if (!deferredPrompt) return;
        banner.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choice => {
            deferredPrompt = null;
        });
    }

    window.addEventListener('appinstalled', () => {
        banner.style.display = 'none';
        deferredPrompt = null;
    });
</script>
</body>
</html>
